repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: '(guest/moon\.pkg$|guest/pkg\.generated\.mbti$)'
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  - repo: local
    hooks:
      - id: moon-fmt
        name: MoonBit Format (guest/)
        entry: bash -c 'cd guest && moon fmt'
        language: system
        files: '^guest/.*\.mbt(\.md)?$'
        pass_filenames: false
      - id: moon-check
        name: MoonBit Check (guest/)
        entry: bash -c 'cd guest && moon check --deny-warn'
        language: system
        files: '^guest/.*\.mbt(\.md)?$'
        pass_filenames: false
      - id: moon-test
        name: MoonBit Test (guest/)
        entry: bash -c 'cd guest && moon test'
        language: system
        files: '^guest/.*\.mbt(\.md)?$'
        pass_filenames: false
      - id: kotlin-format
        name: Kotlin Format (kotlinter)
        entry: ./gradlew formatKotlin
        language: system
        files: '\.kts?$'
        pass_filenames: false
