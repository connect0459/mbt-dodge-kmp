[versions]
kotlin = "2.4.20"
kotlinter = "5.7.0"
chasm = "2.2.0-1.7.0"
chasm-runtime = "1.7.0"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
